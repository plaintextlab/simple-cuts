[project]
name = "simple-cuts"
version = "0.3.0"
description = "Simple video cutter: trim camera footage and strip audio before editing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
# Runtime deps are system packages (PyGObject, GTK4, GStreamer, ffmpeg):
# simple-cuts.sh installs them with your distro's package manager.
dependencies = []

[project.scripts]
simple-cuts = "simple_cuts.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_cuts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
