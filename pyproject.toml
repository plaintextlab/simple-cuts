[project]
name = "simple-cuts"
version = "0.1.0"
description = "Simple video cutter: trim camera footage and strip audio before editing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.8",
    "PySide6-Addons>=6.8",
]

[project.scripts]
simple-cuts = "simple_cuts.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_cuts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
